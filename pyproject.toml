[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-control"
version = "0.1.0"
description = "Bounded coding-agent orchestration for independent GitHub projects"
requires-python = ">=3.12"
dependencies = ["modal==1.6.3", "fastapi==0.115.12", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.4"]

[project.scripts]
swarm-control = "swarm_control.cli:main"

[tool.setuptools.packages.find]
include = ["swarm_control*"]

[tool.setuptools.package-data]
swarm_control = ["dashboard_static/*.html", "dashboard_static/*.js", "dashboard_static/*.css"]

[tool.ruff]
target-version = "py312"
